<div class="container">

    <div class="alert">
        <h2>System Alert</h2>
        <p id="alertMessage">System is operating normally.</p>
    </div>

    <div class="card">
        <h3>Temperature Conditions</h3>
        <p>Below 20°C → Low</p>
        <p>20°C - 29.9°C → Normal</p>
        <p>30°C - 34.9°C → Warning</p>
        <p>35°C and above → Critical</p>
    </div>

</div>
